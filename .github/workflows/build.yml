name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Linux dependencies
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-${{ runner.arch }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-apt-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libpng-dev \
            libbz2-dev \
            libvorbis-dev \
            libpcre2-dev

      - name: Cache macOS dependencies
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Homebrew
          key: ${{ runner.os }}-${{ runner.arch }}-brew-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-brew-

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install cmake pkg-config libpng bzip2 libvorbis pcre2

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Package build artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/cli/bspp dist/bspp-${{ matrix.name }}
          cp build/lib/libbspp.a dist/libbspp-${{ matrix.name }}.a
          chmod +x dist/bspp-${{ matrix.name }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bspp-${{ matrix.name }}
          path: |
            dist/bspp-${{ matrix.name }}
            dist/libbspp-${{ matrix.name }}.a
          if-no-files-found: error
          retention-days: 7
